name: Release

# Builds sdigo.exe and attaches it to a GitHub Release whenever a tag
# matching v*.*.* is pushed (e.g. v0.1.0), via scripts/release.sh -
# see docs/RELEASE.md for what that script does and why the
# manifest/version resource it generates isn't committed.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # go-winres's git-tag version resolution needs tag history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release
        working-directory: .
        run: scripts/release.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: sdigo.exe
          generate_release_notes: true
